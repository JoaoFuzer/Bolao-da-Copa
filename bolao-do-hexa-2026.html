  .header-overlay {
    position: absolute; inset: 0; z-index: 1;
    background: linear-gradient(180deg, rgba(0,80,20,0.45) 0%, rgba(0,0,0,0.55) 100%);
  }
  .header-top { position: relative; z-index: 2; display: flex; flex-direction: column; align-items: center; padding: 28px 20px 22px; text-align: center; }
  .trophy-ring { width: 68px; height: 68px; border-radius: 50%; background: rgba(255,255,255,0.15); display: flex; align-items: center; justify-content: center; font-size: 34px; margin-bottom: 12px; border: 2px solid rgba(255,220,0,0.5); box-shadow: 0 0 20px rgba(255,220,0,0.2); }
  .event-label { font-family: 'Barlow Condensed', sans-serif; font-size: 11px; font-weight: 700; letter-spacing: 2.5px; text-transform: uppercase; color: rgba(255,255,255,0.8); margin-bottom: 4px; text-shadow: 0 1px 4px rgba(0,0,0,0.5); }
  .header-title { font-family: 'Barlow Condensed', sans-serif; font-size: 40px; font-weight: 800; color: #fff; line-height: 1; margin-bottom: 4px; text-shadow: 0 2px 8px rgba(0,0,0,0.6); }
  .header-sub { font-size: 13px; color: rgba(255,255,255,0.85); text-shadow: 0 1px 4px rgba(0,0,0,0.5); }
  .header-stripe { height: 6px; background: linear-gradient(90deg, var(--verde) 0%, var(--amarelo) 40%, var(--amarelo) 60%, var(--verde) 100%); position: relative; z-index: 2; }

  .config-banner { background: #fffbeb; border-bottom: 1px solid #fde68a; padding: 10px 16px; font-size: 12px; color: #92400e; text-align: center; display: none; }
  .config-banner.show { display: block; }

  .main { max-width: 520px; margin: 0 auto; padding: 0 16px; }
  .tabs-wrap { background: var(--surface); border-radius: 0 0 var(--radius) var(--radius); border: 1px solid var(--border); border-top: none; overflow: hidden; margin-bottom: 20px; box-shadow: 0 2px 12px rgba(0,0,0,0.06); }
  .tabs { display: flex; border-bottom: 1px solid var(--border); }
  .tab { flex: 1; padding: 12px 4px; font-size: 12px; font-weight: 600; font-family: 'Barlow Condensed', sans-serif; letter-spacing: 0.5px; text-transform: uppercase; color: var(--text-muted); cursor: pointer; text-align: center; border: none; background: none; border-bottom: 3px solid transparent; transition: color 0.15s; }
  .tab:hover { color: var(--verde); }
  .tab.active { color: var(--verde); border-bottom-color: var(--verde); background: rgba(0,156,59,0.03); }
  .tab-icon { display: block; font-size: 16px; margin-bottom: 1px; }
  .panel { display: none; padding: 18px 18px 20px; }
  .panel.active { display: block; }

  .sec-title { font-family: 'Barlow Condensed', sans-serif; font-size: 12px; font-weight: 700; letter-spacing: 1.5px; text-transform: uppercase; color: var(--text-muted); margin: 20px 0 10px; display: flex; align-items: center; gap: 6px; }
  .sec-title:first-child { margin-top: 0; }
  .sec-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--verde); flex-shrink: 0; }

  .game-card { background: var(--bg); border-radius: var(--radius-sm); border: 1px solid var(--border); padding: 14px 16px; margin-bottom: 10px; }
  .game-card.next-game { background: var(--surface); border: 2px solid var(--verde); }
  .game-meta { font-size: 11px; color: var(--text-muted); margin-bottom: 10px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .badge { font-size: 10px; font-weight: 700; padding: 2px 8px; border-radius: 20px; font-family: 'Barlow Condensed', sans-serif; letter-spacing: 0.5px; text-transform: uppercase; }
  .badge-next { background: var(--verde-light); color: var(--verde-dark); }
  .badge-past { background: #f3f4f6; color: var(--text-muted); }
  .badge-pago { background: var(--verde-light); color: var(--verde-dark); }
  .badge-pendente { background: #fff7ed; color: #c2410c; border: 1px solid #fed7aa; }

  .teams-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .team { display: flex; flex-direction: column; align-items: center; gap: 5px; flex: 1; }
  .team-flag { font-size: 42px; line-height: 1; }
  .team-name { font-size: 13px; font-weight: 600; text-align: center; color: var(--text); }
  .vs-center { text-align: center; flex: 0 0 80px; }
  .score-inputs { display: flex; align-items: center; gap: 4px; justify-content: center; }
  .score-sep { font-size: 18px; font-weight: 700; color: var(--text-muted); }
  .score-hint { font-size: 10px; color: var(--text-faint); margin-top: 3px; }
  .score-stepper { display: flex; align-items: center; gap: 4px; }
  .step-btn { width: 26px; height: 26px; border-radius: 50%; border: 1.5px solid var(--verde); background: transparent; color: var(--verde); font-size: 16px; font-weight: 700; cursor: pointer; display: flex; align-items: center; justify-content: center; line-height: 1; transition: all 0.15s; user-select: none; -webkit-user-select: none; }
  .step-btn:active { background: var(--verde); color: #fff; transform: scale(0.92); }
  .score-display { min-width: 28px; height: 36px; text-align: center; font-size: 22px; font-weight: 800; font-family: 'Barlow Condensed', sans-serif; color: var(--text); display: flex; align-items: center; justify-content: center; }
  .stadium-line { margin-top: 10px; font-size: 11px; color: var(--text-muted); display: flex; align-items: center; gap: 4px; }

  .field { margin-top: 14px; }
  .field label { display: block; font-size: 12px; font-weight: 600; color: var(--text-muted); margin-bottom: 5px; text-transform: uppercase; letter-spacing: 0.5px; font-family: 'Barlow Condensed', sans-serif; }
  .field input { width: 100%; height: 44px; padding: 0 14px; border: 1.5px solid var(--border); border-radius: var(--radius-sm); font-size: 15px; font-family: 'Barlow', sans-serif; background: var(--surface); color: var(--text); outline: none; transition: border-color 0.15s; }
  .field input:focus { border-color: var(--verde); }

  .btn-register { width: 100%; margin-top: 14px; padding: 15px; font-size: 16px; font-weight: 700; font-family: 'Barlow Condensed', sans-serif; letter-spacing: 0.5px; text-transform: uppercase; background: var(--verde); color: #fff; border: none; border-radius: var(--radius-sm); cursor: pointer; transition: background 0.15s, transform 0.1s; }
  .btn-register:hover { background: var(--verde-dark); }
  .btn-register:active { transform: scale(0.98); }
  .btn-register:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

  .pix-card { background: var(--bg); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 14px 16px; display: flex; align-items: flex-start; gap: 14px; margin-top: 14px; }
  .qr-box { width: 120px; height: 120px; flex-shrink: 0; background: #fff; border-radius: 8px; border: 1px solid var(--border); display: flex; align-items: center; justify-content: center; padding: 4px; }
  .pix-details h4 { font-size: 14px; font-weight: 600; margin-bottom: 3px; }
  .pix-details p { font-size: 12px; color: var(--text-muted); line-height: 1.5; }
  .pix-copy { margin-top: 8px; display: inline-flex; align-items: center; gap: 5px; font-size: 11px; font-weight: 600; font-family: 'Barlow Condensed', sans-serif; text-transform: uppercase; color: var(--verde); background: var(--verde-light); border: none; border-radius: 6px; padding: 5px 10px; cursor: pointer; }

  /* Palpite item */
  .palpite-item { display: flex; align-items: center; justify-content: space-between; padding: 10px 13px; background: var(--bg); border-radius: var(--radius-sm); margin-bottom: 7px; border: 1px solid var(--border); gap: 8px; }
  .palpite-item.pendente { border-color: #fed7aa; background: #fffaf7; }
  .palpite-left { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
  .palpite-name { font-size: 13px; font-weight: 500; display: flex; align-items: center; gap: 7px; }
  .palpite-avatar { width: 28px; height: 28px; border-radius: 50%; background: var(--verde-light); display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 700; color: var(--verde-dark); flex-shrink: 0; font-family: 'Barlow Condensed', sans-serif; }
  .palpite-avatar.pendente-avatar { background: #fff7ed; color: #c2410c; }
  .palpite-score { font-family: 'Barlow Condensed', sans-serif; font-size: 16px; font-weight: 700; color: var(--text); display: flex; align-items: center; gap: 5px; flex-shrink: 0; }

  /* Ranking */
  .rank-row { display: flex; align-items: center; gap: 10px; padding: 10px 13px; border-radius: var(--radius-sm); margin-bottom: 7px; background: var(--bg); border: 1px solid var(--border); }
  .rank-pos { font-family: 'Barlow Condensed', sans-serif; font-size: 16px; font-weight: 800; width: 26px; text-align: center; flex-shrink: 0; }
  .rank-name { flex: 1; font-size: 13px; font-weight: 500; }
  .rank-palpites { font-size: 12px; color: var(--text-muted); }
  .pts-pill { background: var(--verde-light); color: var(--verde-dark); font-size: 12px; font-weight: 700; padding: 3px 10px; border-radius: 20px; font-family: 'Barlow Condensed', sans-serif; }
  .rank-pendente-note { background: #fff7ed; border: 1px solid #fed7aa; border-radius: var(--radius-sm); padding: 10px 14px; font-size: 12px; color: #92400e; margin-bottom: 14px; line-height: 1.5; }

  /* Tabela */
  .group-block { margin-bottom: 14px; }
  .group-label { font-family: 'Barlow Condensed', sans-serif; font-size: 11px; font-weight: 700; letter-spacing: 1.5px; text-transform: uppercase; color: #fff; background: var(--azul); padding: 4px 10px; border-radius: var(--radius-sm) var(--radius-sm) 0 0; display: inline-block; }
  .group-teams { background: var(--surface); border: 1px solid var(--border); border-radius: 0 var(--radius-sm) var(--radius-sm) var(--radius-sm); overflow: hidden; }
  .group-team-row { display: flex; align-items: center; gap: 10px; padding: 9px 13px; border-bottom: 1px solid var(--border); font-size: 13px; font-weight: 500; }
  .group-team-row:last-child { border-bottom: none; }
  .group-team-row.brasil { background: var(--verde-light); font-weight: 600; color: var(--verde-dark); border-left: 3px solid var(--verde); }
  .group-team-flag { font-size: 22px; line-height: 1; width: 28px; text-align: center; flex-shrink: 0; }
  .caminho-box { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 14px 16px; margin-bottom: 14px; border-left: 4px solid var(--verde); }
  .caminho-box h4 { font-family: 'Barlow Condensed', sans-serif; font-size: 14px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 8px; }
  .caminho-jogo { font-size: 13px; line-height: 1.8; }
  .caminho-jogo strong { font-weight: 600; color: var(--verde-dark); }

  .empty { text-align: center; padding: 2rem 1rem; color: var(--text-muted); font-size: 13px; }
  .empty-icon { font-size: 36px; display: block; margin-bottom: 8px; }
  .loading-inline { text-align: center; padding: 1.5rem; color: var(--text-muted); font-size: 13px; }
  .spinner { display: inline-block; width: 18px; height: 18px; border: 2px solid var(--border); border-top-color: var(--verde); border-radius: 50%; animation: spin 0.7s linear infinite; margin-right: 6px; vertical-align: -4px; }
  @keyframes spin { to { transform: rotate(360deg); } }

  .toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(80px); background: var(--azul); color: #fff; padding: 11px 22px; border-radius: 30px; font-size: 14px; font-weight: 500; transition: transform 0.3s cubic-bezier(.175,.885,.32,1.275); z-index: 999; white-space: nowrap; pointer-events: none; box-shadow: 0 4px 20px rgba(0,0,0,0.18); }
  .toast.show { transform: translateX(-50%) translateY(0); }

function gameDateTime(d,t){ return new Date(d+'T'+t+':00-03:00'); }
function formatDate(d,t){
  const [y,m,dd]=d.split('-');
  const dw=['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'];
  const dt=new Date(d+'T12:00:00');
  return `${dw[dt.getDay()]}, ${dd}/${m} · ${t}h (Brasília)`;
}
function getNextGame(){ const now=new Date(); for(const g of GAMES){ if(gameDateTime(g.date,g.time)>now) return g; } return GAMES[GAMES.length-1]; }
function getPastGames(){ const now=new Date(); return GAMES.filter(g=>gameDateTime(g.date,g.time)<=now); }
function isApostaBloqueada(g){
  const now=new Date();
  const kickoff=gameDateTime(g.date,g.time);
  const cutoff=new Date(kickoff.getTime()-15*60*1000); // 15 min antes
  return now>=cutoff;
}
function tempoRestante(g){
  const now=new Date();
  const cutoff=new Date(gameDateTime(g.date,g.time).getTime()-15*60*1000);
  const diff=cutoff-now;
  if(diff<=0) return null;
  const dias=Math.floor(diff/86400000);
  const hrs=Math.floor((diff%86400000)/3600000);
  const min=Math.floor((diff%3600000)/60000);
  const sec=Math.floor((diff%60000)/1000);
  if(dias>0) return `${dias}d ${String(hrs).padStart(2,'0')}:${String(min).padStart(2,'0')}:${String(sec).padStart(2,'0')}`;
  return `${String(hrs).padStart(2,'0')}:${String(min).padStart(2,'0')}:${String(sec).padStart(2,'0')}`;
}

function maskPhone(el){
  let v=el.value.replace(/\D/g,'');
  if(v.length>11) v=v.substring(0,11);
  if(v.length>6) v=v.replace(/^(\d{2})(\d{5})(\d{0,4})/,'($1) $2-$3');

  el.value=v;
}

function jsonp(url){
  return new Promise((resolve)=>{
    const cb='cb_'+Date.now()+'_'+Math.floor(Math.random()*9999);
    window[cb]=(data)=>{ resolve(data); try{delete window[cb]; s.remove();}catch(e){} };
    const s=document.createElement('script');
    s.src=url+(url.includes('?')?'&':'?')+'callback='+cb;
    s.onerror=()=>{ resolve(null); try{delete window[cb]; s.remove();}catch(e){} };
    document.head.appendChild(s);
  });
}

async function apiPost(payload){
  if(!isConfigured()) throw new Error('não configurado');
  const url=APPS_SCRIPT_URL+'?action=add'
    +'&name='+encodeURIComponent(payload.name)
    +'&gameId='+encodeURIComponent(payload.gameId)
    +'&whats='+encodeURIComponent(payload.whats||'')
    +'&homeTeam='+encodeURIComponent(payload.homeTeam||'')
    +'&awayTeam='+encodeURIComponent(payload.awayTeam||'')
    +'&home='+encodeURIComponent(payload.home||0)
    +'&away='+encodeURIComponent(payload.away||0)
    +'&ts='+encodeURIComponent(payload.ts||Date.now());
  const r=await jsonp(url);
  if(!r) throw new Error('erro');
  return r;
}

async function renderPalpitar(){
  const next=getNextGame(), past=getPastGames();
  let h='';
  if(!isConfigured()){
    h+=`<div class="setup-box">⚙️ <strong>Configuração pendente:</strong> cole a URL do Apps Script na variável <code>APPS_SCRIPT_URL</code> no início do arquivo HTML.</div>`;
  }
  const totaisData = await apiGetTotais();
  const tNext = totaisData&&totaisData.totais?totaisData.totais[next.id]:null;
  const premioAcumulado = tNext?tNext.potPrize:0;

  h+=`<p class="sec-title"><span class="sec-dot"></span> Próximo jogo</p>`;
  if(premioAcumulado>0){
    h+=`<div class="prize-banner">
      <div>
        <div class="prize-banner-label">💰 Prêmio acumulado</div>
        <div class="prize-banner-value">R$ ${premioAcumulado.toFixed(2).replace('.',',')}</div>
        <div class="prize-banner-sub">Para quem acertar o placar exato</div>
      </div>
      <div class="prize-banner-icon">🏆</div>
    </div>`;
  }
  h+=`<div class="game-card next-game">
    <div class="game-meta">📅 ${formatDate(next.date,next.time)} <span class="badge badge-next">Próximo</span></div>
    <div class="teams-row">
      <div class="team"><span class="team-flag">${next.hf}</span><span class="team-name">${next.home}</span></div>
      <div class="vs-center">
        <div class="score-inputs">
          <div class="score-stepper">
            <button class="step-btn" onclick="stepScore('sc-home',-1)">−</button>
            <span class="score-display" id="sc-home">0</span>
            <button class="step-btn" onclick="stepScore('sc-home',1)">+</button>
          </div>
          <span class="score-sep">×</span>
          <div class="score-stepper">
            <button class="step-btn" onclick="stepScore('sc-away',-1)">−</button>
            <span class="score-display" id="sc-away">0</span>
            <button class="step-btn" onclick="stepScore('sc-away',1)">+</button>
          </div>
        </div>
        <div class="score-hint">seu palpite</div>
      </div>
      <div class="team"><span class="team-flag">${next.af}</span><span class="team-name">${next.away}</span></div>
    </div>
    <div class="stadium-line">📍 ${next.st}</div>
  </div>`;
  const bloqueado = isApostaBloqueada(next);
  if(!bloqueado){
    const tempo = tempoRestante(next);
    if(tempo && gameDateTime(next.date,next.time)-new Date() < 3600000){ // menos de 1h: mostra countdown
      h+=`<div class="countdown-box">
        <div>
          <div class="countdown-label">⏱ Apostas encerram em</div>
          <div class="countdown-value" id="countdown-val">${tempo}</div>
        </div>
        <div style="font-size:28px">⚽</div>
      </div>`;
    }
    h+=`<div class="field"><label for="player-name">Seu nome</label><input type="text" id="player-name" placeholder="Ex: João Silva" maxlength="40"/></div>`;
    h+=`<div class="field">
      <label for="player-whats">WhatsApp para contato</label>
      <div style="position:relative">
        <span style="position:absolute;left:12px;top:50%;transform:translateY(-50%);font-size:18px;pointer-events:none">📱</span>
        <input type="tel" id="player-whats" placeholder="(67) 99999-9999" maxlength="20" style="padding-left:40px" oninput="maskPhone(this)"/>
      </div>
      <span style="font-size:11px;color:var(--text-faint);margin-top:4px;display:block">Usado apenas para avisar caso você ganhe 🏆</span>
    </div>`;
    h+=`<button class="btn-register" id="submit-btn" onclick="submitPalpite('${next.id}')">✅ Registrar palpite — R$ 5,00 via Pix</button>`;
  } else {
    h+=`<div class="locked-banner">
      <span class="lock-icon">🔒</span>
      <span>As apostas para este jogo estão <strong>encerradas</strong>.<br>Os palpites foram bloqueados 15 minutos antes do início.</span>
    </div>`;
  }

  if(past.length>0){
    h+=`<p class="sec-title" style="margin-top:22px"><span class="sec-dot"></span> Jogos anteriores</p>`;
    for(const g of past){
      h+=`<div class="game-card">
        <div class="game-meta">📅 ${formatDate(g.date,g.time)} <span class="badge badge-past">Encerrado</span></div>
        <div class="teams-row">
          <div class="team"><span class="team-flag">${g.hf}</span><span class="team-name">${g.home}</span></div>
          <div class="vs-center">${(()=>{
            // Busca resultado: primeiro em _resultadosCache (todos os jogos), depois em _totaisCache (só brasil)
            const res = (window._resultadosCache&&window._resultadosCache[g.id]) ||
                        (window._totaisCache&&window._totaisCache[g.id]&&window._totaisCache[g.id].resultado);
            if(res&&res.homeGoals!=null&&res.awayGoals!=null&&!isNaN(res.homeGoals)){
              const c=res.status==='IN_PLAY'?'#dc2626':'#1a1a1a';
              return `<div style="text-align:center"><span style="font-size:22px;font-weight:800;font-family:'Barlow Condensed',sans-serif;color:${c}">${res.homeGoals} × ${res.awayGoals}</span>${res.status==='IN_PLAY'?'<div style="font-size:10px;color:#dc2626;font-weight:700;animation:pulse 1s infinite">AO VIVO</div>':''}</div>`;
            }

        </div>
        <div class="stadium-line">📍 ${g.st}</div>

    }
  }

let _pendingPalpite=null;

function closeModal(){
  document.getElementById('confirm-modal').classList.add('hidden');
  _pendingPalpite=null;
}

function closeModalOutside(e){
  if(e.target===document.getElementById('confirm-modal')) closeModal();
}

async function confirmPalpite(){
  if(!_pendingPalpite) return;
  const {name,whats,gameId,scoreHome,scoreAway,g}=_pendingPalpite;
  const btn=document.getElementById('modal-confirm-btn');
  btn.disabled=true; btn.innerHTML='<span class="spinner"></span> Salvando...';
  try{
    await apiPost({action:'add',name,whats,gameId,home:scoreHome,away:scoreAway,homeTeam:g.home,awayTeam:g.away,hf:g.id,af:g.id,ts:Date.now()});
    closeModal();
    showToast('🎉 Palpite de '+name+' registrado!');
    // Zerar placar e nome após confirmação
    const scHome=document.getElementById('sc-home'); if(scHome) scHome.textContent='0';
    const scAway=document.getElementById('sc-away'); if(scAway) scAway.textContent='0';
    const pname=document.getElementById('player-name'); if(pname) pname.value='';
    const pwhats=document.getElementById('player-whats'); if(pwhats) pwhats.value='';
    const submitBtn=document.getElementById('submit-btn');
    if(submitBtn){ submitBtn.textContent='✓ Palpite registrado!'; setTimeout(()=>{ submitBtn.disabled=false; submitBtn.textContent='✅ Registrar palpite — R$ 5,00 via Pix'; },2500); }
  }catch(e){
    btn.disabled=false; btn.innerHTML='✔ Confirmar palpite';
    showToast('❌ Erro ao salvar. Verifique a conexão.');
  }
  _pendingPalpite=null;
}

function submitPalpite(gameId){
  const g=GAMES.find(x=>x.id===gameId);
  const name=document.getElementById('player-name').value.trim();
  const whats=document.getElementById('player-whats')?document.getElementById('player-whats').value.trim():'';
  const scoreHome=getScore('sc-home');
  const scoreAway=getScore('sc-away');
  if(!name){ showToast('⚠️ Digite seu nome primeiro!'); return; }
  if(!whats){ showToast('⚠️ Informe seu WhatsApp para contato!'); return; }
  if(isApostaBloqueada(g)){ showToast('🔒 Apostas encerradas para este jogo!'); return; }
  if(!isConfigured()){ showToast('⚙️ Configure a URL do Apps Script primeiro!'); return; }

  // Apenas abre o modal de confirmação — NÃO salva ainda
  _pendingPalpite={name,whats,gameId,scoreHome,scoreAway,g};
  document.getElementById('modal-hf').innerHTML=g.hf;
  document.getElementById('modal-ht').textContent=g.home;
  document.getElementById('modal-af').innerHTML=g.af;
  document.getElementById('modal-at').textContent=g.away;
  document.getElementById('modal-sh').textContent=scoreHome;
  document.getElementById('modal-sa').textContent=scoreAway;
  document.getElementById('modal-name').textContent='👤 '+name;
  document.getElementById('modal-whats').textContent='📱 '+whats;
  document.getElementById('modal-confirm-btn').disabled=false;
  document.getElementById('modal-confirm-btn').innerHTML='✔ Confirmar palpite';
  document.getElementById('confirm-modal').classList.remove('hidden');
}

async function renderPalpites(){
  const el=document.getElementById('palpites-content');
  if(!isConfigured()){ el.innerHTML=`<div class="empty"><span class="empty-icon">⚙️</span>Configure o Apps Script<br>para ver os palpites.</div>`; return; }
  el.innerHTML=`<div class="loading-inline"><span class="spinner"></span> Carregando palpites...</div>`;
  const all=await apiGet('list');
  if(!all.length){ el.innerHTML=`<div class="empty"><span class="empty-icon">📋</span>Nenhum palpite ainda.<br>Seja o primeiro!</div>`; return; }

  const byGame={};
  for(const p of all){ if(!byGame[p.gameId]) byGame[p.gameId]=[]; byGame[p.gameId].push(p); }

  let totalPendente=0;
  let h='';

  const nextGameId = getNextGame().id;

  // Próximo jogo primeiro, jogos passados depois
  const now = new Date();
  const gamesOrdered = [
    ...GAMES.filter(g => gameDateTime(g.date, g.time) > now),
    ...GAMES.filter(g => gameDateTime(g.date, g.time) <= now).reverse()
  ];

  for(const g of gamesOrdered){
    const ps=byGame[g.id]||[];
    if(!ps.length) continue;

    // Estatísticas apenas do próximo jogo
    const pagos=ps.filter(p=>String(p.pago).toUpperCase()==='SIM');
    const scoreCount={};
    for(const p of pagos){
      const k=`${p.home}x${p.away}`;
      scoreCount[k]=(scoreCount[k]||0)+1;
    }
    const topScores=Object.entries(scoreCount).sort((a,b)=>b[1]-a[1]).slice(0,3);

    // Vitória brasil / empate / derrota brasil
    let vBr=0,emp=0,dBr=0;
    for(const p of pagos){
      const h1=parseInt(p.home),a1=parseInt(p.away);
      const brHome=g.home==='Brasil';
      const brGoals=brHome?h1:a1, advGoals=brHome?a1:h1;
      if(brGoals>advGoals) vBr++;
      else if(brGoals===advGoals) emp++;
      else dBr++;
    }

    h+=`<p class="sec-title"><span class="sec-dot"></span>${g.hf} ${g.home} × ${g.away} ${g.af}</p>`;

    if(pagos.length>0 && g.id===nextGameId){
      h+=`<div style="background:var(--bg);border:1px solid var(--border);border-radius:var(--radius-sm);padding:12px 14px;margin-bottom:10px">
        <div style="font-size:11px;font-weight:700;font-family:'Barlow Condensed',sans-serif;text-transform:uppercase;letter-spacing:0.5px;color:var(--text-muted);margin-bottom:8px">📊 Estatísticas (${pagos.length} palpite${pagos.length!==1?'s':''})</div>
        <div style="display:flex;gap:8px;margin-bottom:10px">
          <div style="flex:1;text-align:center;background:var(--verde-light);border-radius:6px;padding:8px 4px">
            <div style="font-size:18px;font-weight:800;font-family:'Barlow Condensed',sans-serif;color:var(--verde-dark)">${vBr}</div>
            <div style="font-size:10px;color:var(--verde-dark);font-weight:600">🇧🇷 Vitória</div>
          </div>
          <div style="flex:1;text-align:center;background:#f3f4f6;border-radius:6px;padding:8px 4px">
            <div style="font-size:18px;font-weight:800;font-family:'Barlow Condensed',sans-serif;color:var(--text-muted)">${emp}</div>
            <div style="font-size:10px;color:var(--text-muted);font-weight:600">🤝 Empate</div>
          </div>
          <div style="flex:1;text-align:center;background:#fef2f2;border-radius:6px;padding:8px 4px">
            <div style="font-size:18px;font-weight:800;font-family:'Barlow Condensed',sans-serif;color:#dc2626">${dBr}</div>
            <div style="font-size:10px;color:#dc2626;font-weight:600">❌ Derrota</div>
          </div>
        </div>
        ${topScores.length>0?`<div style="font-size:11px;font-weight:700;font-family:'Barlow Condensed',sans-serif;text-transform:uppercase;letter-spacing:0.5px;color:var(--text-muted);margin-bottom:5px">Placares mais apostados</div>
        ${topScores.map(([k,cnt])=>`<div style="display:flex;justify-content:space-between;align-items:center;padding:4px 0;border-top:0.5px solid var(--border)">
          <span style="font-family:'Barlow Condensed',sans-serif;font-size:15px;font-weight:700">${k.replace('x',' × ')}</span>
          <span style="font-size:12px;color:var(--text-muted)">${cnt} aposta${cnt!==1?'s':''}</span>
        </div>`).join('')}`:''}
      </div>`;
    }

    for(const p of ps){
      const pago = String(p.pago).toUpperCase()==='SIM';
      if(!pago) totalPendente++;
      h+=`<div class="palpite-item${pago?'':' pendente'}">
        <div class="palpite-left">
          <div class="palpite-name">
            <div class="palpite-avatar${pago?'':' pendente-avatar'}">${initials(p.name)}</div>
            ${p.name}
          </div>
          ${pago
            ? `<span class="badge badge-pago">✅ Pago</span>`
            : `<span class="badge badge-pendente">⏳ Aguardando confirmação do adm</span>`
          }
        </div>
        <div class="palpite-score">${g.hf} ${p.home} <span style="color:#9ca3af;font-weight:400">×</span> ${p.away} ${g.af}</div>
      </div>`;
    }
  }
  if(totalPendente>0){
    h=`<div style="background:#fff7ed;border:1px solid #fed7aa;border-radius:var(--radius-sm);padding:10px 14px;font-size:12px;color:#92400e;margin-bottom:14px">
      ⏳ <strong>${totalPendente} palpite${totalPendente>1?'s':''} aguardando confirmação do administrador.</strong> Para confirmar, abra a planilha e escreva <strong>SIM</strong> na coluna Pago.
    </div>`+h;
  }
  el.innerHTML=h||`<div class="empty">Nenhum palpite encontrado.</div>`;
}

async function renderRanking(){
  const el=document.getElementById('ranking-content');
  if(!isConfigured()){ el.innerHTML=`<div class="empty"><span class="empty-icon">⚙️</span>Configure o Apps Script<br>para ver o ranking.</div>`; return; }
  el.innerHTML=`<div class="loading-inline"><span class="spinner"></span> Carregando ranking...</div>`;

  const [all, totaisResp] = await Promise.all([apiGet('list'), apiGetTotais()]);
  const totais   = totaisResp&&totaisResp.totais ? totaisResp.totais : {};
  const acumuladoTotal = totaisResp ? totaisResp.acumuladoTotal||0 : 0;

  const pagos    = all.filter(p=>String(p.pago).toUpperCase()==='SIM');
  const pendentes= all.filter(p=>String(p.pago).toUpperCase()!=='SIM');

  let h='';

  // Banner prêmio acumulado total
  if(acumuladoTotal>0){
    h+=`<div class="prize-banner" style="margin-bottom:16px">
      <div>
        <div class="prize-banner-label">🏆 Prêmio acumulado total</div>
        <div class="prize-banner-value">R$ ${acumuladoTotal.toFixed(2).replace('.',',')}</div>
        <div class="prize-banner-sub">Ninguém acertou ainda — vai para o próximo jogo!</div>
      </div>
      <div class="prize-banner-icon">💰</div>
    </div>`;
  }

  // Resultados por jogo
  h+=`<p class="sec-title"><span class="sec-dot"></span> Resultado por jogo</p>`;
  for(const g of GAMES){
    const t=totais[g.id];
    if(!t) continue;
    const isPast = new Date(g.date+'T'+g.time+':00-03:00') <= new Date();
    if(!isPast && !t.resultado) continue;

    h+=`<div class="game-prize-row">
      <div class="game-prize-info">
        ${g.hf} ${g.home} × ${g.away} ${g.af}
        <span>${formatDate(g.date,g.time)}</span>
      </div>`;

    if(t.status==='ao_vivo'){
      h+=`<span class="ao-vivo-badge">🔴 Ao vivo</span>`;
    } else if(t.status==='encerrado' && t.ganhadores.length>0){
      h+=`<div class="game-prize-value">R$ ${t.potPrize.toFixed(2).replace('.',',')} ✅</div>`;
    } else if(t.status==='acumulou'){
      h+=`<div class="game-prize-value acumulou">Acumulou 🔁</div>`;
    } else {
      h+=`<div class="game-prize-value" style="color:var(--text-muted)">R$ ${t.potPrize.toFixed(2).replace('.',',')} 🎯</div>`;
    }
    h+=`</div>`;

    // Ganhadores
    if(t.status==='encerrado' && t.resultado){
      h+=`<div class="winner-box">
        <h5>⚽ Resultado: ${t.resultado.homeGoals} × ${t.resultado.awayGoals}</h5>`;
      if(t.ganhadores.length>0){
        t.ganhadores.forEach(w=>{
          const nome = typeof w==='object'?w.name:w;
          h+=`<div class="winner-item">
            <span class="winner-name">🥇 ${nome}</span>
            <span class="winner-prize">R$ ${t.premio.toFixed(2).replace('.',',')}</span>
          </div>`;
        });
      }
      h+=`</div>`;
    } else if(t.status==='acumulou' && t.resultado){
      h+=`<div class="acumulado-box">⚽ Resultado: ${t.resultado.homeGoals} × ${t.resultado.awayGoals} — Ninguém acertou o placar exato. Prêmio acumulado para o próximo jogo!</div>`;
    }
  }

  // Ranking de pontos
  h+=`<p class="sec-title" style="margin-top:20px"><span class="sec-dot"></span> Ranking de acertos</p>`;

  if(!pagos.length){
    h+=pendentes.length>0
      ? `<div class="rank-pendente-note">⏳ ${pendentes.length} palpite${pendentes.length>1?'s':''} aguardando confirmação de pagamento.</div>`
      : `<div class="empty"><span class="empty-icon">🏅</span>Nenhum palpite confirmado ainda.</div>`;
    el.innerHTML=h; return;
  }

  // Calcular pontos: apenas o MELHOR palpite de cada pessoa por jogo
  // 3 pts = placar exato, 1 pt = resultado correto
  // Se fez vários palpites no mesmo jogo, conta só o de maior pontuação
  const byName={};
  for(const p of pagos){
    if(!byName[p.name]) byName[p.name]={name:p.name,jogos:{},pts:0,acertos:[],palpites:0};
    byName[p.name].palpites++;
    const t=totais[p.gameId];
    let ptsPalpite=0, tipoAcerto='';
    if(t&&t.resultado&&t.resultado.homeGoals!=null){
      const rh=t.resultado.homeGoals, ra=t.resultado.awayGoals;
      const ph=parseInt(p.home), pa=parseInt(p.away);
      if(ph===rh&&pa===ra){ ptsPalpite=3; tipoAcerto='placar exato'; }
      else if((ph>pa&&rh>ra)||(ph<pa&&rh<ra)||(ph===pa&&rh===ra)){ ptsPalpite=1; tipoAcerto='resultado'; }
    }
    // Guarda só o melhor palpite por jogo
    const jogoAtual=byName[p.name].jogos[p.gameId];
    if(!jogoAtual || ptsPalpite > jogoAtual.pts){
      byName[p.name].jogos[p.gameId]={pts:ptsPalpite, tipo:tipoAcerto};
    }
  }
  // Somar pontos dos melhores palpites por jogo
  for(const pessoa of Object.values(byName)){
    pessoa.pts=0; pessoa.acertos=[];
    for(const jogo of Object.values(pessoa.jogos)){
      pessoa.pts+=jogo.pts;
      if(jogo.tipo) pessoa.acertos.push(jogo.tipo);
    }
  }

  const sorted=Object.values(byName).sort((a,b)=>b.pts-a.pts||b.acertos.length-a.acertos.length);
  const medals=['🥇','🥈','🥉'];

  if(pendentes.length>0){
    h+=`<div class="rank-pendente-note">💰 <strong>${pendentes.length} palpite${pendentes.length>1?'s':''} pendente${pendentes.length>1?'s':''}</strong> não entram no ranking. Confirme o pagamento na planilha.</div>`;
  }

  sorted.forEach((p,i)=>{
    h+=`<div class="rank-row">
      <div class="rank-pos" style="color:${i===0?'#b8860b':i===1?'#888':i===2?'#a0522d':'#9ca3af'}">${medals[i]||(i+1)}</div>
      <div style="flex:1">
        <div class="rank-name">${p.name}</div>
        <div class="rank-pts-detail">${p.palpites} palpite${p.palpites!==1?'s':''} · ${p.acertos.length} acerto${p.acertos.length!==1?'s':''}</div>
      </div>
      <div class="pts-pill">${p.pts} pts</div>
    </div>`;
  });
  h+=`<p style="font-size:11px;color:#9ca3af;text-align:center;margin-top:10px">3 pts = placar exato · 1 pt = resultado correto · somente pagos</p>`;
  el.innerHTML=h;
}

    h+=`<button class="group-btn${isBr?' brasil-grp':''}${g===_activeGroup?' active':''}" onclick="selectGroup('${g}')">Grupo ${g}</button>`;

  el.innerHTML=h;

}

function selectGroup(g){
  _activeGroup=g;
  document.querySelectorAll('.group-btn').forEach(b=>{
    const label=b.textContent.trim();
    const isAll=label==='Todos' && g===null;
    const isMatch=label==='Grupo '+g;
    b.classList.toggle('active', isAll||isMatch);
  });
  loadStandings(g);
}

async function loadStandings(group){
  const area=document.getElementById('standings-area');
  if(!area) return;

  const now=Date.now();
  if(_standingsCache && _standingsCache.ts && (now-_standingsCache.ts)<300000){
    renderAllStandings(_standingsCache.data, group);
    return;
  }

  area.innerHTML=`<div class="tabela-loading"><span class="spinner"></span> Carregando classificação...</div>`;

  const resp = await apiGetStandings();
  if(resp && resp.standings && Object.keys(resp.standings).length>0){
    _standingsCache = { data: resp.standings, ts: now };
    renderAllStandings(resp.standings, group);
  } else {
    renderAllStatic(group);
  }
}

function buildGroupTable(group, grpData){
  let h=`<div class="group-block" id="grp-${group}">
    <div class="group-label">Grupo ${group}</div>
    <div class="group-teams" style="overflow:auto">
      <table class="standings-table">
        <thead><tr>
          <th class="th-team" style="width:36%">Seleção</th>
          <th title="Jogos">J</th><th title="Vitórias">V</th>
          <th title="Empates">E</th><th title="Derrotas">D</th>
          <th title="Gols Pró">GP</th><th title="Gols Contra">GC</th>
          <th title="Saldo">SG</th><th title="Pontos" style="color:var(--azul)">Pts</th>
        </tr></thead><tbody>`;
  grpData.forEach((team,i)=>{
    const isBrasil=team.name==='Brazil';
    const isQual=i<2, isPoss=i===2;
    const rowClass=isBrasil?'brasil-row':isQual?'qualificado':isPoss?'possivel':'';
    const flag=flagMap[team.name]||'fi-xx';
    const sg=(team.goalsFor||0)-(team.goalsAgainst||0);
    const nome=nameMap[team.name]||team.shortName||team.name;
    h+=`<tr class="${rowClass}">
      <td class="td-team">
        <span class="pos-col">${i+1}</span>
        <span class="fi ${flag}" style="width:20px!important;height:15px!important;border-radius:2px;display:inline-block;vertical-align:middle;flex-shrink:0"></span>
        ${nome}
      </td>
      <td>${team.playedGames||0}</td><td>${team.won||0}</td>
      <td>${team.draw||0}</td><td>${team.lost||0}</td>
      <td>${team.goalsFor||0}</td><td>${team.goalsAgainst||0}</td>
      <td style="color:${sg>0?'var(--verde-dark)':sg<0?'#dc2626':'var(--text-muted)'}">${sg>0?'+'+sg:sg}</td>
      <td class="pts-col">${team.points||0}</td>
    </tr>`;
  });
  h+=`</tbody></table></div></div>`;
  return h;
}

function buildGroupStatic(grp){
  let h=`<div class="group-block" id="grp-${grp.g}">
    <div class="group-label">Grupo ${grp.g}</div>
    <div class="group-teams">`;
  for(const t of grp.teams){
    h+=`<div class="group-team-row${t.br?' brasil':''}">
      <span class="group-team-flag">${t.f}</span>
      <span style="flex:1">${t.n}</span>
      <span style="font-size:11px;color:var(--text-faint)">Aguardando jogos</span>
    </div>`;
  }
  h+=`</div></div>`;
  return h;
}

function renderAllStandings(standings, filter){
  const area=document.getElementById('standings-area');
  if(!area) return;
  const groupLetters=['A','B','C','D','E','F','G','H','I','J','K','L'];
  const toShow=filter?[filter]:groupLetters;

  let h=`<div class="legend-box">
    <div class="legend-item"><div class="legend-dot" style="background:#009c3b"></div> Classificado</div>
    <div class="legend-item"><div class="legend-dot" style="background:#e6f1fb"></div> Possível vaga</div>
  </div>`;

  for(const g of toShow){
    const grpData=standings[g];
    if(grpData && grpData.length>0){
      h+=buildGroupTable(g, grpData);
    } else {
      const grp=GROUPS.find(x=>x.g===g);
      if(grp) h+=buildGroupStatic(grp);
    }
  }
  area.innerHTML=h;
}

function renderAllStatic(filter){
  const area=document.getElementById('standings-area');
  if(!area) return;
  const toShow=filter?GROUPS.filter(g=>g.g===filter):GROUPS;
  let h='<p style="font-size:11px;color:var(--text-faint);text-align:center;margin-bottom:10px">Pontuação disponível após o início da Copa · 13/jun/2026</p>';
  for(const grp of toShow) h+=buildGroupStatic(grp);
  area.innerHTML=h;
}
