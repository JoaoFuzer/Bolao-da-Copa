<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Bolão do Hexa 2026</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;500;600;700;800&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/lipis/flag-icons@7.2.3/css/flag-icons.min.css"/>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --verde: #009c3b; --verde-dark: #006b29; --verde-light: #e8f7ef;
    --amarelo: #ffdf00; --azul: #002776;
    --bg: #f4f6f3; --surface: #ffffff; --border: rgba(0,0,0,0.08);
    --text: #1a1a1a; --text-muted: #6b7280; --text-faint: #9ca3af;
    --radius: 14px; --radius-sm: 8px;
  }
  body { font-family: 'Barlow', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; padding-bottom: 40px; }

  .header { background: var(--verde); overflow: hidden; position: relative; }
  .header-bg-pattern { position: absolute; inset: 0; background-image: repeating-linear-gradient(60deg, rgba(255,255,255,0.04) 0px, rgba(255,255,255,0.04) 1px, transparent 1px, transparent 30px); }
  .header-top { position: relative; z-index: 1; display: flex; flex-direction: column; align-items: center; padding: 28px 20px 22px; text-align: center; }
  .trophy-ring { width: 64px; height: 64px; border-radius: 50%; background: rgba(255,255,255,0.15); display: flex; align-items: center; justify-content: center; font-size: 32px; margin-bottom: 12px; border: 2px solid rgba(255,255,255,0.25); }
  .event-label { font-family: 'Barlow Condensed', sans-serif; font-size: 11px; font-weight: 700; letter-spacing: 2.5px; text-transform: uppercase; color: rgba(255,255,255,0.7); margin-bottom: 4px; }
  .header-title { font-family: 'Barlow Condensed', sans-serif; font-size: 38px; font-weight: 800; color: #fff; line-height: 1; margin-bottom: 4px; }
  .header-sub { font-size: 13px; color: rgba(255,255,255,0.75); }
  .header-stripe { height: 8px; background: linear-gradient(90deg, var(--verde) 0%, var(--amarelo) 40%, var(--amarelo) 60%, var(--verde) 100%); position: relative; z-index: 1; }

  .config-banner { background: #fffbeb; border-bottom: 1px solid #fde68a; padding: 10px 16px; font-size: 12px; color: #92400e; text-align: center; display: none; }
  .config-banner.show { display: block; }

  .main { max-width: 520px; margin: 0 auto; padding: 0 16px; }
  .tabs-wrap { background: var(--surface); border-radius: 0 0 var(--radius) var(--radius); border: 1px solid var(--border); border-top: none; overflow: hidden; margin-bottom: 20px; box-shadow: 0 2px 12px rgba(0,0,0,0.06); }
  .tabs { display: flex; border-bottom: 1px solid var(--border); }
  .tab { flex: 1; padding: 12px 4px; font-size: 12px; font-weight: 600; font-family: 'Barlow Condensed', sans-serif; letter-spacing: 0.5px; text-transform: uppercase; color: var(--text-muted); cursor: pointer; text-align: center; border: none; background: none; border-bottom: 3px solid transparent; transition: color 0.15s; }
  .tab:hover { color: var(--verde); }
  .tab.active { color: var(--verde); border-bottom-color: var(--verde); background: rgba(0,156,59,0.03); }
  .tab-icon { display: block; font-size: 16px; margin-bottom: 1px; }
  .panel { display: none; padding: 18px 18px 20px; }
  .panel.active { display: block; }

  .sec-title { font-family: 'Barlow Condensed', sans-serif; font-size: 12px; font-weight: 700; letter-spacing: 1.5px; text-transform: uppercase; color: var(--text-muted); margin: 20px 0 10px; display: flex; align-items: center; gap: 6px; }
  .sec-title:first-child { margin-top: 0; }
  .sec-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--verde); flex-shrink: 0; }

  .game-card { background: var(--bg); border-radius: var(--radius-sm); border: 1px solid var(--border); padding: 14px 16px; margin-bottom: 10px; }
  .game-card.next-game { background: var(--surface); border: 2px solid var(--verde); }
  .game-meta { font-size: 11px; color: var(--text-muted); margin-bottom: 10px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .badge { font-size: 10px; font-weight: 700; padding: 2px 8px; border-radius: 20px; font-family: 'Barlow Condensed', sans-serif; letter-spacing: 0.5px; text-transform: uppercase; }
  .badge-next { background: var(--verde-light); color: var(--verde-dark); }
  .badge-past { background: #f3f4f6; color: var(--text-muted); }
  .badge-pago { background: var(--verde-light); color: var(--verde-dark); }
  .badge-pendente { background: #fff7ed; color: #c2410c; border: 1px solid #fed7aa; }

  .teams-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .team { display: flex; flex-direction: column; align-items: center; gap: 5px; flex: 1; }
  .team-flag { font-size: 42px; line-height: 1; }
  .team-name { font-size: 13px; font-weight: 600; text-align: center; color: var(--text); }
  .vs-center { text-align: center; flex: 0 0 80px; }
  .score-inputs { display: flex; align-items: center; gap: 4px; justify-content: center; }
  .score-input { width: 42px; height: 42px; text-align: center; font-size: 20px; font-weight: 700; border: 1.5px solid var(--border); border-radius: var(--radius-sm); background: var(--surface); color: var(--text); outline: none; font-family: 'Barlow Condensed', sans-serif; transition: border-color 0.15s; }
  .score-input:focus { border-color: var(--verde); }
  .score-sep { font-size: 18px; font-weight: 700; color: var(--text-muted); }
  .score-hint { font-size: 10px; color: var(--text-faint); margin-top: 3px; }
  .stadium-line { margin-top: 10px; font-size: 11px; color: var(--text-muted); display: flex; align-items: center; gap: 4px; }

  .field { margin-top: 14px; }
  .field label { display: block; font-size: 12px; font-weight: 600; color: var(--text-muted); margin-bottom: 5px; text-transform: uppercase; letter-spacing: 0.5px; font-family: 'Barlow Condensed', sans-serif; }
  .field input { width: 100%; height: 44px; padding: 0 14px; border: 1.5px solid var(--border); border-radius: var(--radius-sm); font-size: 15px; font-family: 'Barlow', sans-serif; background: var(--surface); color: var(--text); outline: none; transition: border-color 0.15s; }
  .field input:focus { border-color: var(--verde); }

  .btn-register { width: 100%; margin-top: 14px; padding: 15px; font-size: 16px; font-weight: 700; font-family: 'Barlow Condensed', sans-serif; letter-spacing: 0.5px; text-transform: uppercase; background: var(--verde); color: #fff; border: none; border-radius: var(--radius-sm); cursor: pointer; transition: background 0.15s, transform 0.1s; }
  .btn-register:hover { background: var(--verde-dark); }
  .btn-register:active { transform: scale(0.98); }
  .btn-register:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

  .pix-card { background: var(--bg); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 14px 16px; display: flex; align-items: flex-start; gap: 14px; margin-top: 14px; }
  .qr-box { width: 90px; height: 90px; flex-shrink: 0; background: #fff; border-radius: 8px; border: 1px solid var(--border); display: flex; align-items: center; justify-content: center; padding: 6px; }
  .pix-details h4 { font-size: 14px; font-weight: 600; margin-bottom: 3px; }
  .pix-details p { font-size: 12px; color: var(--text-muted); line-height: 1.5; }
  .pix-copy { margin-top: 8px; display: inline-flex; align-items: center; gap: 5px; font-size: 11px; font-weight: 600; font-family: 'Barlow Condensed', sans-serif; text-transform: uppercase; color: var(--verde); background: var(--verde-light); border: none; border-radius: 6px; padding: 5px 10px; cursor: pointer; }

  /* Palpite item */
  .palpite-item { display: flex; align-items: center; justify-content: space-between; padding: 10px 13px; background: var(--bg); border-radius: var(--radius-sm); margin-bottom: 7px; border: 1px solid var(--border); gap: 8px; }
  .palpite-item.pendente { border-color: #fed7aa; background: #fffaf7; }
  .palpite-left { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
  .palpite-name { font-size: 13px; font-weight: 500; display: flex; align-items: center; gap: 7px; }
  .palpite-avatar { width: 28px; height: 28px; border-radius: 50%; background: var(--verde-light); display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 700; color: var(--verde-dark); flex-shrink: 0; font-family: 'Barlow Condensed', sans-serif; }
  .palpite-avatar.pendente-avatar { background: #fff7ed; color: #c2410c; }
  .palpite-score { font-family: 'Barlow Condensed', sans-serif; font-size: 16px; font-weight: 700; color: var(--text); display: flex; align-items: center; gap: 5px; flex-shrink: 0; }

  /* Ranking */
  .rank-row { display: flex; align-items: center; gap: 10px; padding: 10px 13px; border-radius: var(--radius-sm); margin-bottom: 7px; background: var(--bg); border: 1px solid var(--border); }
  .rank-pos { font-family: 'Barlow Condensed', sans-serif; font-size: 16px; font-weight: 800; width: 26px; text-align: center; flex-shrink: 0; }
  .rank-name { flex: 1; font-size: 13px; font-weight: 500; }
  .rank-palpites { font-size: 12px; color: var(--text-muted); }
  .pts-pill { background: var(--verde-light); color: var(--verde-dark); font-size: 12px; font-weight: 700; padding: 3px 10px; border-radius: 20px; font-family: 'Barlow Condensed', sans-serif; }
  .rank-pendente-note { background: #fff7ed; border: 1px solid #fed7aa; border-radius: var(--radius-sm); padding: 10px 14px; font-size: 12px; color: #92400e; margin-bottom: 14px; line-height: 1.5; }

  /* Tabela */
  .group-block { margin-bottom: 14px; }
  .group-label { font-family: 'Barlow Condensed', sans-serif; font-size: 11px; font-weight: 700; letter-spacing: 1.5px; text-transform: uppercase; color: #fff; background: var(--azul); padding: 4px 10px; border-radius: var(--radius-sm) var(--radius-sm) 0 0; display: inline-block; }
  .group-teams { background: var(--surface); border: 1px solid var(--border); border-radius: 0 var(--radius-sm) var(--radius-sm) var(--radius-sm); overflow: hidden; }
  .group-team-row { display: flex; align-items: center; gap: 10px; padding: 9px 13px; border-bottom: 1px solid var(--border); font-size: 13px; font-weight: 500; }
  .group-team-row:last-child { border-bottom: none; }
  .group-team-row.brasil { background: var(--verde-light); font-weight: 600; color: var(--verde-dark); border-left: 3px solid var(--verde); }
  .group-team-flag { font-size: 22px; line-height: 1; width: 28px; text-align: center; flex-shrink: 0; }
  .caminho-box { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 14px 16px; margin-bottom: 14px; border-left: 4px solid var(--verde); }
  .caminho-box h4 { font-family: 'Barlow Condensed', sans-serif; font-size: 14px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 8px; }
  .caminho-jogo { font-size: 13px; line-height: 1.8; }
  .caminho-jogo strong { font-weight: 600; color: var(--verde-dark); }

  .empty { text-align: center; padding: 2rem 1rem; color: var(--text-muted); font-size: 13px; }
  .empty-icon { font-size: 36px; display: block; margin-bottom: 8px; }
  .loading-inline { text-align: center; padding: 1.5rem; color: var(--text-muted); font-size: 13px; }
  .spinner { display: inline-block; width: 18px; height: 18px; border: 2px solid var(--border); border-top-color: var(--verde); border-radius: 50%; animation: spin 0.7s linear infinite; margin-right: 6px; vertical-align: -4px; }
  @keyframes spin { to { transform: rotate(360deg); } }

  .toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(80px); background: var(--azul); color: #fff; padding: 11px 22px; border-radius: 30px; font-size: 14px; font-weight: 500; transition: transform 0.3s cubic-bezier(.175,.885,.32,1.275); z-index: 999; white-space: nowrap; pointer-events: none; box-shadow: 0 4px 20px rgba(0,0,0,0.18); }
  .toast.show { transform: translateX(-50%) translateY(0); }

  .setup-box { background: #fffbeb; border: 1px solid #fde68a; border-radius: var(--radius-sm); padding: 14px 16px; margin-bottom: 16px; font-size: 13px; color: #92400e; line-height: 1.6; }


  .fi { border-radius: 3px; }
  .team-flag .fi { width: 52px !important; height: 39px !important; border-radius: 5px; display: block; margin: 0 auto; }
  .palpite-score .fi { width: 20px !important; height: 15px !important; border-radius: 2px; display: inline-block; vertical-align: middle; }
  .group-team-flag .fi { width: 28px !important; height: 21px !important; border-radius: 2px; display: inline-block; vertical-align: middle; }
  .sec-title .fi { width: 18px !important; height: 14px !important; border-radius: 2px; display: inline-block; vertical-align: middle; }
  .caminho-jogo .fi { width: 18px !important; height: 14px !important; border-radius: 2px; display: inline-block; vertical-align: middle; }

  @media (max-width: 420px) { .header-title { font-size: 30px; } .team-flag { font-size: 24px; } .tab { font-size: 11px; } }
</style>
</head>
<body>

<header class="header">
  <div class="header-bg-pattern"></div>
  <div class="header-top">
    <div class="trophy-ring">🏆</div>
    <div class="event-label">Copa do Mundo 2026</div>
    <h1 class="header-title"><span class="fi fi-br" style="width:36px!important;height:27px!important;border-radius:4px;display:inline-block;vertical-align:middle;margin-right:8px"></span>Bolão do Hexa</h1>
    <p class="header-sub">Anderson Gomes · Campo Grande/MS</p>
  </div>
  <div class="header-stripe"></div>
</header>

<div id="config-banner" class="config-banner">
  ⚙️ <strong>Configuração pendente:</strong> cole a URL do Apps Script na variável <code>APPS_SCRIPT_URL</code> no arquivo HTML.
</div>

<div class="main">
  <div class="tabs-wrap">
    <div class="tabs">
      <button class="tab active" onclick="showTab('palpitar')"><span class="tab-icon">✏️</span>Palpitar</button>
      <button class="tab" onclick="showTab('palpites')"><span class="tab-icon">📋</span>Palpites</button>
      <button class="tab" onclick="showTab('ranking')"><span class="tab-icon">🏅</span>Ranking</button>
      <button class="tab" onclick="showTab('tabela')"><span class="tab-icon">📊</span>Tabela</button>
    </div>
    <div id="panel-palpitar" class="panel active"><div id="palpitar-content"></div></div>
    <div id="panel-palpites" class="panel"><div id="palpites-content"></div></div>
    <div id="panel-ranking" class="panel"><div id="ranking-content"></div></div>
    <div id="panel-tabela" class="panel"><div id="tabela-content"></div></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
// ============================================================
//  CONFIGURAÇÃO — cole aqui a URL do seu Apps Script
// ============================================================
const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbxXZqZpJy0J2_UGHXzmY16skJ9N8jCjhyFaUY7GaPwN79bKhBPDN3ZJh_QorAOWM7j_/exec';
// ============================================================

const PIX_CODE = '00020101021126580014br.gov.bcb.pix01360ebfdc0c-dcfd-4313-9321-a4d99e294cc95204000053039865802BR5923ANDERSON GOMES DA SILVA6012CAMPO GRANDE62070503***63043F36';

const GAMES = [
  { id:'g1', date:'2026-06-13', time:'19:00', home:'Brasil',  away:'Marrocos',  hf:'<span class="fi fi-br"></span>', af:'<span class="fi fi-ma"></span>', st:'MetLife Stadium · Nova York/NJ' },
  { id:'g2', date:'2026-06-19', time:'21:30', home:'Brasil',  away:'Haiti',     hf:'<span class="fi fi-br"></span>', af:'<span class="fi fi-ht"></span>', st:'Lincoln Financial Field · Filadélfia' },
  { id:'g3', date:'2026-06-24', time:'19:00', home:'Escócia', away:'Brasil',    hf:'<span class="fi fi-gb-sct"></span>', af:'<span class="fi fi-br"></span>', st:'Hard Rock Stadium · Miami' },
  { id:'g4', date:'2026-06-29', time:'14:00', home:'Brasil',  away:'(Grupo F)', hf:'<span class="fi fi-br"></span>', af:'<span class="fi fi-xx"></span>', st:'NRG Stadium · Houston ou Monterrey' },
];

const GROUPS = [
  { g:'A', teams:[{n:'México',f:'<span class="fi fi-mx"></span>'},{n:'África do Sul',f:'<span class="fi fi-za"></span>'},{n:'Coreia do Sul',f:'<span class="fi fi-kr"></span>'},{n:'Dinamarca / Rep. Tcheca',f:'<span class="fi fi-dk"></span>'}] },
  { g:'B', teams:[{n:'Canadá',f:'<span class="fi fi-ca"></span>'},{n:'Catar',f:'<span class="fi fi-qa"></span>'},{n:'Suíça',f:'<span class="fi fi-ch"></span>'},{n:'Itália / País de Gales',f:'<span class="fi fi-it"></span>'}] },
  { g:'C', teams:[{n:'Brasil',f:'<span class="fi fi-br"></span>',br:true},{n:'Marrocos',f:'<span class="fi fi-ma"></span>'},{n:'Haiti',f:'<span class="fi fi-ht"></span>'},{n:'Escócia',f:'<span class="fi fi-gb-sct"></span>'}] },
  { g:'D', teams:[{n:'Estados Unidos',f:'<span class="fi fi-us"></span>'},{n:'Paraguai',f:'<span class="fi fi-py"></span>'},{n:'Austrália',f:'<span class="fi fi-au"></span>'},{n:'Turquia / Romênia',f:'<span class="fi fi-tr"></span>'}] },
  { g:'E', teams:[{n:'Alemanha',f:'<span class="fi fi-de"></span>'},{n:'Curaçao',f:'<span class="fi fi-cw"></span>'},{n:'Costa do Marfim',f:'<span class="fi fi-ci"></span>'},{n:'Equador',f:'<span class="fi fi-ec"></span>'}] },
  { g:'F', teams:[{n:'Holanda',f:'<span class="fi fi-nl"></span>'},{n:'Japão',f:'<span class="fi fi-jp"></span>'},{n:'Tunísia',f:'<span class="fi fi-tn"></span>'},{n:'Ucrânia / Suécia',f:'<span class="fi fi-ua"></span>'}] },
  { g:'G', teams:[{n:'Bélgica',f:'<span class="fi fi-be"></span>'},{n:'Egito',f:'<span class="fi fi-eg"></span>'},{n:'Irã',f:'<span class="fi fi-ir"></span>'},{n:'Nova Zelândia',f:'<span class="fi fi-nz"></span>'}] },
  { g:'H', teams:[{n:'Espanha',f:'<span class="fi fi-es"></span>'},{n:'Cabo Verde',f:'<span class="fi fi-cv"></span>'},{n:'Arábia Saudita',f:'<span class="fi fi-sa"></span>'},{n:'Uruguai',f:'<span class="fi fi-uy"></span>'}] },
  { g:'I', teams:[{n:'França',f:'<span class="fi fi-fr"></span>'},{n:'Senegal',f:'<span class="fi fi-sn"></span>'},{n:'Noruega',f:'<span class="fi fi-no"></span>'},{n:'Iraque / Bolívia',f:'<span class="fi fi-iq"></span>'}] },
  { g:'J', teams:[{n:'Argentina',f:'<span class="fi fi-ar"></span>'},{n:'Argélia',f:'<span class="fi fi-dz"></span>'},{n:'Áustria',f:'<span class="fi fi-at"></span>'},{n:'Jordânia',f:'<span class="fi fi-jo"></span>'}] },
  { g:'K', teams:[{n:'Portugal',f:'<span class="fi fi-pt"></span>'},{n:'Uzbequistão',f:'<span class="fi fi-uz"></span>'},{n:'Colômbia',f:'<span class="fi fi-co"></span>'},{n:'Congo / Jamaica',f:'<span class="fi fi-cd"></span>'}] },
  { g:'L', teams:[{n:'Inglaterra',f:'<span class="fi fi-gb-eng"></span>'},{n:'Croácia',f:'<span class="fi fi-hr"></span>'},{n:'Gana',f:'<span class="fi fi-gh"></span>'},{n:'Panamá',f:'<span class="fi fi-pa"></span>'}] },
];

const isConfigured = () => APPS_SCRIPT_URL && APPS_SCRIPT_URL.startsWith('https://');
function gameDateTime(d,t){ return new Date(d+'T'+t+':00-03:00'); }
function formatDate(d,t){
  const [y,m,dd]=d.split('-');
  const dw=['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'];
  const dt=new Date(d+'T12:00:00');
  return `${dw[dt.getDay()]}, ${dd}/${m} · ${t}h (Brasília)`;
}
function getNextGame(){ const now=new Date(); for(const g of GAMES){ if(gameDateTime(g.date,g.time)>now) return g; } return GAMES[GAMES.length-1]; }
function getPastGames(){ const now=new Date(); return GAMES.filter(g=>gameDateTime(g.date,g.time)<=now); }
function showToast(msg){ const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show'); setTimeout(()=>t.classList.remove('show'),3200); }
function clamp(el){ let v=parseInt(el.value); if(isNaN(v)||v<0)el.value=0; if(v>20)el.value=20; }
function initials(name){ return name.trim().split(' ').slice(0,2).map(w=>w[0].toUpperCase()).join(''); }

function showTab(tab){
  document.querySelectorAll('.tab').forEach((t,i)=>{ t.classList.toggle('active',['palpitar','palpites','ranking','tabela'][i]===tab); });
  document.querySelectorAll('.panel').forEach(p=>p.classList.remove('active'));
  document.getElementById('panel-'+tab).classList.add('active');
  if(tab==='palpites') renderPalpites();
  if(tab==='ranking') renderRanking();
  if(tab==='tabela') renderTabela();
}

async function apiGet(action){
  if(!isConfigured()) return [];
  return new Promise((resolve)=>{
    const cb='cb_'+Date.now();
    window[cb]=(data)=>{ resolve(data.data||[]); delete window[cb]; s.remove(); };
    const s=document.createElement('script');
    s.src=APPS_SCRIPT_URL+'?action='+action+'&callback='+cb;
    s.onerror=()=>{ resolve([]); delete window[cb]; };
    document.head.appendChild(s);
  });
}
async function apiPost(payload){
  if(!isConfigured()) throw new Error('não configurado');
  const url=APPS_SCRIPT_URL+'?action=add&name='+encodeURIComponent(payload.name)
    +'&gameId='+encodeURIComponent(payload.gameId)
    +'&homeTeam='+encodeURIComponent(payload.homeTeam||'')
    +'&awayTeam='+encodeURIComponent(payload.awayTeam||'')
    +'&home='+encodeURIComponent(payload.home||0)
    +'&away='+encodeURIComponent(payload.away||0)
    +'&ts='+encodeURIComponent(payload.ts||Date.now());
  return new Promise((resolve,reject)=>{
    const cb='cb_'+Date.now();
    window[cb]=(data)=>{ resolve(data); delete window[cb]; s.remove(); };
    const s=document.createElement('script');
    s.src=url+'&callback='+cb;
    s.onerror=()=>{ reject(new Error('erro')); delete window[cb]; };
    document.head.appendChild(s);
  });
}

  return `<svg width="78" height="78" viewBox="0 0 78 78" xmlns="http://www.w3.org/2000/svg"><rect width="78" height="78" fill="white"/><g fill="#002776"><rect x="4" y="4" width="28" height="28" rx="3"/><rect x="7" y="7" width="22" height="22" rx="2" fill="white"/><rect x="11" y="11" width="14" height="14" rx="1"/><rect x="46" y="4" width="28" height="28" rx="3"/><rect x="49" y="7" width="22" height="22" rx="2" fill="white"/><rect x="53" y="11" width="14" height="14" rx="1"/><rect x="4" y="46" width="28" height="28" rx="3"/><rect x="7" y="49" width="22" height="22" rx="2" fill="white"/><rect x="11" y="53" width="14" height="14" rx="1"/><rect x="38" y="4" width="4" height="4"/><rect x="38" y="12" width="4" height="8"/><rect x="4" y="38" width="16" height="4"/><rect x="24" y="38" width="4" height="4"/><rect x="46" y="38" width="4" height="4"/><rect x="54" y="38" width="10" height="4"/><rect x="68" y="38" width="6" height="4"/><rect x="46" y="46" width="8" height="4"/><rect x="58" y="42" width="4" height="4"/><rect x="50" y="54" width="4" height="8"/><rect x="58" y="52" width="4" height="4"/><rect x="66" y="46" width="8" height="6"/><rect x="62" y="58" width="12" height="6"/><rect x="58" y="64" width="4" height="4"/><rect x="38" y="48" width="8" height="4"/><rect x="38" y="56" width="4" height="8"/><rect x="46" y="60" width="4" height="4"/></g></svg>`;
}

function renderPalpitar(){
  const next=getNextGame(), past=getPastGames();
  let h='';
  if(!isConfigured()){
    h+=`<div class="setup-box">⚙️ <strong>Configuração pendente:</strong> cole a URL do Apps Script na variável <code>APPS_SCRIPT_URL</code> no início do arquivo HTML.</div>`;
  }
  h+=`<p class="sec-title"><span class="sec-dot"></span> Próximo jogo</p>`;
  h+=`<div class="game-card next-game">
    <div class="game-meta">📅 ${formatDate(next.date,next.time)} <span class="badge badge-next">Próximo</span></div>
    <div class="teams-row">
      <div class="team"><span class="team-flag">${next.hf}</span><span class="team-name">${next.home}</span></div>
      <div class="vs-center">
        <div class="score-inputs">
          <input type="number" min="0" max="20" value="0" class="score-input" id="sc-home" oninput="clamp(this)"/>
          <span class="score-sep">×</span>
          <input type="number" min="0" max="20" value="0" class="score-input" id="sc-away" oninput="clamp(this)"/>
        </div>
        <div class="score-hint">seu palpite</div>
      </div>
      <div class="team"><span class="team-flag">${next.af}</span><span class="team-name">${next.away}</span></div>
    </div>
    <div class="stadium-line">📍 ${next.st}</div>
  </div>`;
  h+=`<div class="field"><label for="player-name">Seu nome</label><input type="text" id="player-name" placeholder="Ex: João Silva" maxlength="40"/></div>`;
  h+=`<button class="btn-register" id="submit-btn" onclick="submitPalpite('${next.id}')">✅ Registrar palpite — R$ 5,00 via Pix</button>`;

  if(past.length>0){
    h+=`<p class="sec-title" style="margin-top:22px"><span class="sec-dot"></span> Jogos anteriores</p>`;
    for(const g of past){
      h+=`<div class="game-card">
        <div class="game-meta">📅 ${formatDate(g.date,g.time)} <span class="badge badge-past">Encerrado</span></div>
        <div class="teams-row">
          <div class="team"><span class="team-flag">${g.hf}</span><span class="team-name">${g.home}</span></div>
          <div class="vs-center"><span style="font-size:20px;font-weight:700;color:#9ca3af">—</span></div>
          <div class="team"><span class="team-flag">${g.af}</span><span class="team-name">${g.away}</span></div>
        </div>
        <div class="stadium-line">📍 ${g.st}</div>
      </div>`;
    }
  }

  h+=`<p class="sec-title" style="margin-top:22px"><span class="sec-dot"></span> Pagamento via Pix</p>`;
  h+=`<div class="pix-card">
    <div class="qr-box">${qrSVG()}</div>
    <div class="pix-details">
      <h4>Anderson Gomes da Silva</h4>
      <p>Entrada: <strong>R$ 5,00</strong> por palpite<br>Campo Grande / MS</p>
      <button class="pix-copy" onclick="copyPix()">📋 Copiar código Pix</button>
    </div>
  </div>`;

  document.getElementById('palpitar-content').innerHTML=h;
  if(isConfigured()) document.getElementById('config-banner').classList.remove('show');
}

async function submitPalpite(gameId){
  const g=GAMES.find(x=>x.id===gameId);
  const home=g?g.home:''; const away=g?g.away:'';
  const name=document.getElementById('player-name').value.trim();
  const scoreHome=parseInt(document.getElementById('sc-home').value)||0;
  const scoreAway=parseInt(document.getElementById('sc-away').value)||0;
  if(!name){ showToast('⚠️ Digite seu nome primeiro!'); return; }
  if(!isConfigured()){ showToast('⚙️ Configure a URL do Apps Script primeiro!'); return; }
  const btn=document.getElementById('submit-btn');
  btn.disabled=true; btn.innerHTML='<span class="spinner"></span> Salvando...';
  try{
    await apiPost({action:'add',name,gameId,home:scoreHome,away:scoreAway,homeTeam:home,awayTeam:away,hf:g?g.id:'',af:g?g.id:'',ts:Date.now()});
    showToast('🎉 Palpite registrado! Aguardando confirmação do Pix.');
    btn.textContent='✓ Palpite registrado!';
    setTimeout(()=>{ btn.disabled=false; btn.textContent='✅ Registrar palpite — R$ 5,00 via Pix'; },2500);
  }catch(e){
    btn.disabled=false; btn.textContent='✅ Registrar palpite — R$ 5,00 via Pix';
    showToast('❌ Erro ao salvar. Verifique a conexão.');
  }
}

async function renderPalpites(){
  const el=document.getElementById('palpites-content');
  if(!isConfigured()){ el.innerHTML=`<div class="empty"><span class="empty-icon">⚙️</span>Configure o Apps Script<br>para ver os palpites.</div>`; return; }
  el.innerHTML=`<div class="loading-inline"><span class="spinner"></span> Carregando palpites...</div>`;
  const all=await apiGet('list');
  if(!all.length){ el.innerHTML=`<div class="empty"><span class="empty-icon">📋</span>Nenhum palpite ainda.<br>Seja o primeiro!</div>`; return; }

  const byGame={};
  for(const p of all){ if(!byGame[p.gameId]) byGame[p.gameId]=[]; byGame[p.gameId].push(p); }

  let totalPendente=0;
  let h='';
  for(const g of GAMES){
    const ps=byGame[g.id]||[];
    if(!ps.length) continue;
    h+=`<p class="sec-title"><span class="sec-dot"></span>${g.hf} ${g.home} × ${g.away} ${g.af}</p>`;
    for(const p of ps){
      const pago = String(p.pago).toUpperCase()==='SIM';
      if(!pago) totalPendente++;
      h+=`<div class="palpite-item${pago?'':' pendente'}">
        <div class="palpite-left">
          <div class="palpite-name">
            <div class="palpite-avatar${pago?'':' pendente-avatar'}">${initials(p.name)}</div>
            ${p.name}
          </div>
          ${pago
            ? `<span class="badge badge-pago">✅ Pago</span>`
            : `<span class="badge badge-pendente">💰 Pagamento pendente</span>`
          }
        </div>
        <div class="palpite-score">${p.hf||g.hf} ${p.home} <span style="color:#9ca3af;font-weight:400">×</span> ${p.away} ${p.af||g.af}</div>
      </div>`;
    }
  }
  if(totalPendente>0){
    h=`<div style="background:#fff7ed;border:1px solid #fed7aa;border-radius:var(--radius-sm);padding:10px 14px;font-size:12px;color:#92400e;margin-bottom:14px">
      💰 <strong>${totalPendente} palpite${totalPendente>1?'s':''} com pagamento pendente.</strong> Para confirmar, abra a planilha e escreva <strong>SIM</strong> na coluna Pago.
    </div>`+h;
  }
  el.innerHTML=h||`<div class="empty">Nenhum palpite encontrado.</div>`;
}

async function renderRanking(){
  const el=document.getElementById('ranking-content');
  if(!isConfigured()){ el.innerHTML=`<div class="empty"><span class="empty-icon">⚙️</span>Configure o Apps Script<br>para ver o ranking.</div>`; return; }
  el.innerHTML=`<div class="loading-inline"><span class="spinner"></span> Carregando ranking...</div>`;
  const all=await apiGet('list');

  const pagos=all.filter(p=>String(p.pago).toUpperCase()==='SIM');
  const pendentes=all.filter(p=>String(p.pago).toUpperCase()!=='SIM');

  if(!pagos.length){
    let h='';
    if(pendentes.length>0){
      h+=`<div class="rank-pendente-note">⏳ Há ${pendentes.length} palpite${pendentes.length>1?'s':''} aguardando confirmação de pagamento. O ranking aparecerá após a confirmação.</div>`;
    } else {
      h+=`<div class="empty"><span class="empty-icon">🏅</span>Ranking disponível após<br>confirmação dos pagamentos!</div>`;
    }
    el.innerHTML=h; return;
  }

  const byName={};
  for(const p of pagos){ if(!byName[p.name]) byName[p.name]={name:p.name,palpites:0,pts:0}; byName[p.name].palpites++; }
  const sorted=Object.values(byName).sort((a,b)=>b.pts-a.pts||b.palpites-a.palpites);
  const medals=['🥇','🥈','🥉'];
  let h='';
  if(pendentes.length>0){
    h+=`<div class="rank-pendente-note">💰 <strong>${pendentes.length} palpite${pendentes.length>1?'s':''} pendente${pendentes.length>1?'s':''}</strong> não entram no ranking ainda. Confirme o pagamento na planilha.</div>`;
  }
  sorted.forEach((p,i)=>{
    h+=`<div class="rank-row">
      <div class="rank-pos" style="color:${i===0?'#b8860b':i===1?'#888':i===2?'#a0522d':'#9ca3af'}">${medals[i]||(i+1)}</div>
      <div class="rank-name">${p.name}</div>
      <div class="rank-palpites">${p.palpites} palpite${p.palpites!==1?'s':''}</div>
      <div class="pts-pill">${p.pts} pts</div>
    </div>`;
  });
  h+=`<p style="font-size:11px;color:#9ca3af;text-align:center;margin-top:10px">3 pts = placar exato · 1 pt = resultado correto · somente pagos</p>`;
  el.innerHTML=h;
}

function copyPix(){
  if(navigator.clipboard){ navigator.clipboard.writeText(PIX_CODE).then(()=>showToast('📋 Código Pix copiado!')); }
  else{ const ta=document.createElement('textarea'); ta.value=PIX_CODE; document.body.appendChild(ta); ta.select(); document.execCommand('copy'); document.body.removeChild(ta); showToast('📋 Código Pix copiado!'); }
}

renderPalpitar();
</script>
